name: iPadOS Native Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-device-ipa:
    name: Build unsigned native iPadOS IPA
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout Unwritten Studio
        uses: actions/checkout@v4

      - name: Install Rust and Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Record build environment
        run: |
          rustc --version
          cargo --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check Rust core for iOS device
        run: cargo check --locked -p unwritten-studio-core --target aarch64-apple-ios

      - name: Check Rust core for iOS Simulator
        run: cargo check --locked -p unwritten-studio-core --target aarch64-apple-ios-sim

      - name: Build native app and package unsigned IPA
        run: ./scripts/build-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: unwritten-studio-unsigned-ipa
          path: build/ios/unsigned/UnwrittenStudio-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unwritten-studio-ios-build-logs
          path: |
            build/ios/DerivedData-unsigned/Logs/**
            build/ios/iphoneos/**
          if-no-files-found: ignore
          retention-days: 14
