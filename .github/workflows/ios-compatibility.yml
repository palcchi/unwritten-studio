name: iOS Compatibility Probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Check whether EffectCraft compiles for iPadOS
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout Unwritten Studio source
        uses: actions/checkout@v4

      - name: Install Rust and iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Probe native app for iOS
        shell: bash
        run: |
          set +e
          cargo check --locked -p effectcraft --target aarch64-apple-ios 2>&1 | tee ios-compatibility.log
          result=${PIPESTATUS[0]}
          echo "" | tee -a ios-compatibility.log
          echo "cargo_check_exit_code=${result}" | tee -a ios-compatibility.log
          if [ "${result}" -eq 0 ]; then
            echo "iOS Rust compile check passed."
          else
            echo "iOS Rust compile check failed. The log is retained as an artifact so the missing platform adaptations can be identified."
          fi
          exit 0

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unwritten-studio-ios-compatibility
          path: ios-compatibility.log
          if-no-files-found: warn
          retention-days: 14
