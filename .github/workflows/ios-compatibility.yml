name: iOS Native Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-device-ipa:
    name: Build unsigned native iPhone and iPad IPA
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout Unwritten Studio
        uses: actions/checkout@v4

      - name: Install Rust and Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Test native engine workflows
        run: cargo test --locked -p unwritten-studio-core --lib -- --include-ignored

      - name: Test iPad sandbox output policy
        run: cargo test --locked -p unwritten-studio-engine --lib ipad_render_defaults_stay_inside_documents_even_for_external_projects

      - name: Test native project formats and safe AE writes
        run: cargo test --locked -p unwritten-studio-engine --lib format_tests

      - name: Test experimental native AEP import
        run: |
          cargo test --locked -p unwritten-studio-aep
          cargo test --locked -p unwritten-studio-aep-import
          cargo test --locked -p unwritten-studio-engine --lib native_aep

      - name: Test save prompt before changing projects
        run: cargo test --locked -p unwritten-studio-ui-egui --lib panels::unsaved

      - name: Test experimental After Effects bridge
        run: |
          cargo test --locked -p unwritten-studio-engine --lib ae_bridge
          node scripts/test-ae-bridge.cjs

      - name: Test portrait and landscape viewport geometry
        run: python3 scripts/test-ios-viewport.py

      - name: Test workspace docking persistence
        run: cargo test --locked -p unwritten-studio-ui-egui --test shared_docking_ui

      - name: Test draggable workspace panels
        run: cargo test --locked -p unwritten-studio-ui-egui --test ui_dock_resize

      - name: Test original frontend lifecycle
        run: cargo test --locked -p unwritten-studio-ui-egui --lib embedded_original_ui_bootstraps_fonts_and_renders_without_panicking

      - name: Test original audio feed and nonblocking callback
        run: cargo test --locked -p unwritten-studio-ui-egui --lib audio::tests

      - name: Record build environment
        run: |
          rustc --version
          cargo --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check Rust core for iOS device
        run: cargo check --locked -p unwritten-studio-core --target aarch64-apple-ios

      - name: Check Rust core for iOS Simulator
        run: cargo check --locked -p unwritten-studio-core --target aarch64-apple-ios-sim

      - name: Build native app and package unsigned IPA
        run: ./scripts/build-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: unwritten-studio-unsigned-ipa
          path: build/ios/unsigned/UnwrittenStudio-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unwritten-studio-ios-build-logs
          path: |
            build/ios/DerivedData-unsigned/Logs/**
            build/ios/iphoneos/**
          if-no-files-found: ignore
          retention-days: 14

  simulator-smoke:
    name: Launch native workspace on iPhone and iPad simulators
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout Unwritten Studio
        uses: actions/checkout@v4

      - name: Install Rust simulator target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Rust simulator build
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-simulator

      - name: Build and launch real native workspace
        run: bash scripts/smoke-ios-simulator.sh

      - name: Upload simulator screenshots and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unwritten-studio-ios-simulator-smoke
          path: build/ios/simulator-smoke/**
          if-no-files-found: warn
          retention-days: 14
