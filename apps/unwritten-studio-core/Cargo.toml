[package]
name = "unwritten-studio-core"
description = "C ABI bridge from Unwritten Studio for iPadOS to the reusable Unwritten Studio Rust engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
unwritten-studio-engine = { workspace = true }
unwritten-studio-host = { workspace = true }
unwritten-studio-gpu = { workspace = true }
unwritten-studio-project = { workspace = true }
unwritten-studio-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Raw pointers are confined to the documented C boundary in src/lib.rs.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
