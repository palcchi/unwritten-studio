[package]
name = "unwritten-studio-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
unwritten-studio-time = { workspace = true }
unwritten-studio-geom = { workspace = true }
unwritten-studio-keyframe = { workspace = true }
serde_json = { workspace = true }
unwritten-studio-project = { workspace = true }
unwritten-studio-path = { workspace = true }
unwritten-studio-render = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
unwritten-studio-color = { workspace = true }
unwritten-studio-effects = { workspace = true }
unwritten-studio-text = { workspace = true }
