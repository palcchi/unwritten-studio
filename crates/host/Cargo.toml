[package]
name = "unwritten-studio-host"
description = "Builds a fully wired Unwritten Studio session: media decoding (FilmCraft codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
unwritten-studio-engine = { workspace = true }
unwritten-studio-project = { workspace = true }
log = { workspace = true }
unwritten-studio-media = { workspace = true }
unwritten-studio-expr = { workspace = true }
unwritten-studio-script = { workspace = true }
unwritten-studio-export = { workspace = true }
unwritten-studio-plugin = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
unwritten-studio-plugin = { workspace = true, features = ["wasm"] }

[dev-dependencies]
serde_json = { workspace = true }
unwritten-studio-psd = { workspace = true }
unwritten-studio-svg = { workspace = true }
unwritten-studio-pdf = { workspace = true }
unwritten-studio-raster = { workspace = true }
unwritten-studio-time = { workspace = true }
unwritten-studio-interchange = { workspace = true }
image = { workspace = true }
gif = { workspace = true }
exr = { workspace = true }
rayon = { workspace = true }
