[package]
name = "unwritten-studio-plugin"
description = "Unwritten Studio effect plug-ins: loads sandboxed WebAssembly effect modules (plug-in API v1) into the effect registry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The WebAssembly runtime (wasmi, a pure-Rust interpreter). Hosts enable it on native; without
# it `load_wasm` reports that WebAssembly plug-ins are unavailable.
wasm = ["dep:wasmi"]

[dependencies]
unwritten-studio-effects = { workspace = true }
serde_json = { workspace = true }
wasmi = { workspace = true, optional = true }

[dev-dependencies]
unwritten-studio-keyframe = { workspace = true }
unwritten-studio-project = { workspace = true }
unwritten-studio-raster = { workspace = true }
