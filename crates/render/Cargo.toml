[package]
name = "unwritten-studio-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
unwritten-studio-time = { workspace = true }
unwritten-studio-geom = { workspace = true }
unwritten-studio-color = { workspace = true }
unwritten-studio-keyframe = { workspace = true }
unwritten-studio-project = { workspace = true }
unwritten-studio-raster = { workspace = true }
unwritten-studio-path = { workspace = true }
unwritten-studio-text = { workspace = true }
unwritten-studio-effects = { workspace = true }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
unwritten-studio-model = { workspace = true }
kurbo = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
