[package]
name = "unwritten-studio-script"
description = "Unwritten Studio scripting: JavaScript (boa) with an After Effects-style object model (app, project, CompItem, Layer, Property…) over the engine's undoable commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
unwritten-studio-engine = { workspace = true }
unwritten-studio-project = { workspace = true }
unwritten-studio-keyframe = { workspace = true }
unwritten-studio-time = { workspace = true }
unwritten-studio-render = { workspace = true }
unwritten-studio-path = { workspace = true }
serde_json = { workspace = true }
boa_engine = { workspace = true }
web-time = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
unwritten-studio-expr = { workspace = true }
unwritten-studio-psd = { workspace = true }
